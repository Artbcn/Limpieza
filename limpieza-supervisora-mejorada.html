<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART Limpieza - Supervisora</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }

        .header {
            background: linear-gradient(135deg, #2d5016 0%, #1a3009 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .tabs {
            display: flex;
            background: white;
            border-bottom: 2px solid #e0e0e0;
            overflow-x: auto;
            padding: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 16px;
            border: none;
            background: white;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            min-width: 100px;
            text-align: center;
            font-size: 13px;
        }

        .tab-btn.active {
            color: #2d5016;
            border-bottom-color: #2d5016;
        }

        .tab-content { display: none; padding: 20px; min-height: 400px; }
        .tab-content.active { display: block; }

        .empleada-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #2d5016;
        }

        .empleada-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 16px;
        }

        .empleada-pin {
            background: #f0f5eb;
            color: #2d5016;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .tareas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .tarea-item {
            background: #f9f9f9;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            border-left: 3px solid #e0e0e0;
        }

        .tarea-item.completada {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .tarea-item.pendiente {
            background: #fff8e1;
            border-left-color: #ff9800;
        }

        .tarea-apto { font-weight: 600; color: #2d5016; }
        .tarea-estado { font-size: 10px; color: #666; margin-top: 4px; }

        .foto-badge {
            display: inline-block;
            background: #2196F3;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            margin-right: 4px;
        }

        .comentario-badge {
            display: inline-block;
            background: #9C27B0;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 12px;
        }

        .stat-box {
            background: linear-gradient(135deg, #f0f5eb 0%, #e8f5e9 100%);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-number { font-size: 20px; font-weight: bold; color: #2d5016; }
        .stat-label { font-size: 11px; color: #666; margin-top: 4px; }

        .loading { text-align: center; padding: 40px 20px; color: #999; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2d5016;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state { text-align: center; padding: 40px 20px; color: #999; }

        @media (max-width: 768px) {
            .tareas-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            .tab-btn { font-size: 12px; padding: 12px 8px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ART Limpieza - Control Supervisora</h1>
        <p id="dateDisplay">Hoy</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('reparto')">📋 Reparto</button>
        <button class="tab-btn" onclick="switchTab('control')">👥 Control de Empleadas</button>
        <button class="tab-btn" onclick="switchTab('historial')">📊 Historial</button>
    </div>

    <!-- TAB: REPARTO (original) -->
    <div id="reparto" class="tab-content active">
        <p style="text-align: center; color: #999; padding: 40px 20px;">
            Contenido original de Reparto
            <br><br>
            (Aquí va tu lógica actual de distribución)
        </p>
    </div>

    <!-- TAB: CONTROL DE EMPLEADAS (NUEVO) -->
    <div id="control" class="tab-content">
        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="totalEmpleadas">0</div>
                <div class="stat-label">Empleadas</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="tareasCompletadas">0</div>
                <div class="stat-label">Completadas</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="tareasPendientes">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
        </div>

        <div id="empleadasControl" style="margin-top: 20px;"></div>
        <div id="loadingControl" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Cargando estado de empleadas...</p>
        </div>
        <div id="emptyControl" class="empty-state" style="display: none;">
            <p>Sin empleadas asignadas</p>
        </div>
    </div>

    <!-- TAB: HISTORIAL -->
    <div id="historial" class="tab-content">
        <p style="text-align: center; color: #999; padding: 40px 20px;">
            Historial de tareas completadas
            <br><br>
            (Se cargará próximamente)
        </p>
    </div>

    <script>
        // SUPABASE CONFIG
        const SUPABASE_URL = 'https://nevhnfkbrwwelmokspzt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldmhuZmticnd3ZWxtb2tzcHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MzA0NDgsImV4cCI6MjEwMDMwNjQ0OH0.fk05FBrzZZoqtBvz--jeWBWiHmbi6U-rSY4uzJXCMQY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // INIT
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');

            if (tabName === 'control') loadControlPanel();
        }

        function updateDate() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = today.toLocaleDateString('es-ES', options);
            document.getElementById('dateDisplay').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }

        async function loadControlPanel() {
            const container = document.getElementById('empleadasControl');
            const loading = document.getElementById('loadingControl');
            const empty = document.getElementById('emptyControl');

            loading.style.display = 'block';
            container.innerHTML = '';

            try {
                // Cargar empleadas
                const { data: empleadas, error: empError } = await supabase
                    .from('empleadas')
                    .select('*')
                    .eq('activa', true);

                if (empError) throw empError;

                if (!empleadas || empleadas.length === 0) {
                    loading.style.display = 'none';
                    empty.style.display = 'block';
                    return;
                }

                loading.style.display = 'none';
                container.innerHTML = '';

                let totalCompletadas = 0;
                let totalPendientes = 0;

                // Para cada empleada, cargar sus tareas
                for (const empleada of empleadas) {
                    const { data: tareas, error: tarError } = await supabase
                        .from('limp_parte')
                        .select('*')
                        .eq('empleada_id', empleada.id);

                    if (tarError) continue;

                    const completadas = (tareas || []).filter(t => t.estado === 'completada').length;
                    const pendientes = (tareas || []).filter(t => t.estado === 'pendiente').length;
                    totalCompletadas += completadas;
                    totalPendientes += pendientes;

                    const card = document.createElement('div');
                    card.className = 'empleada-card';
                    card.innerHTML = `
                        <div class="empleada-header">
                            <span>${empleada.nombre}</span>
                            <span class="empleada-pin">PIN: ${empleada.pin}</span>
                        </div>
                        <div class="stats" style="gap: 8px;">
                            <div style="background: #fff3cd; padding: 8px; border-radius: 6px; text-align: center;">
                                <div style="font-weight: 600; color: #ff9800;">${pendientes}</div>
                                <div style="font-size: 11px; color: #666;">Pendientes</div>
                            </div>
                            <div style="background: #e8f5e9; padding: 8px; border-radius: 6px; text-align: center;">
                                <div style="font-weight: 600; color: #4caf50;">${completadas}</div>
                                <div style="font-size: 11px; color: #666;">Completadas</div>
                            </div>
                            <div style="background: #e3f2fd; padding: 8px; border-radius: 6px; text-align: center;">
                                <div style="font-weight: 600; color: #2196F3;">${tareas?.length || 0}</div>
                                <div style="font-size: 11px; color: #666;">Total</div>
                            </div>
                        </div>
                        ${tareas && tareas.length > 0 ? `
                            <div class="tareas-grid">
                                ${tareas.map(t => `
                                    <div class="tarea-item ${t.estado}">
                                        <div class="tarea-apto">${t.apto}</div>
                                        <div class="tarea-tipo" style="font-size: 10px; color: #666;">${t.tipo || 'TAREA'}</div>
                                        <div class="tarea-estado">
                                            ${t.estado === 'completada' ? '✓ Hecho' : 'Pendiente'}
                                        </div>
                                        ${t.fotos && (JSON.parse(t.fotos || '[]')).length > 0 ? `<span class="foto-badge">📷 ${(JSON.parse(t.fotos || '[]')).length}</span>` : ''}
                                        ${t.comentarios && (JSON.parse(t.comentarios || '[]')).length > 0 ? `<span class="comentario-badge">💬</span>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<p style="color: #999; font-size: 12px; margin-top: 12px;">Sin tareas asignadas hoy</p>'}
                    `;
                    container.appendChild(card);
                }

                // Actualizar stats globales
                document.getElementById('totalEmpleadas').textContent = empleadas.length;
                document.getElementById('tareasCompletadas').textContent = totalCompletadas;
                document.getElementById('tareasPendientes').textContent = totalPendientes;

            } catch (err) {
                console.error('Error:', err);
                loading.style.display = 'none';
                container.innerHTML = '<p style="color: red; padding: 20px;">Error al cargar datos</p>';
            }
        }

        // Auto-refresh cada 5 segundos si está en tab Control
        setInterval(() => {
            if (document.getElementById('control').classList.contains('active')) {
                loadControlPanel();
            }
        }, 5000);

        // Init
        updateDate();
    </script>
</body>
</html>
