<style>
  :root{ --ink:#17313B; --teal:#0FA3A3; --orange:#E8A13D; --arr:#1E8C4E; --dep:#C0392B;
         --bg:#faf8f3; --card:#fff; --line:#e7e2d6; --soft:#7b7466; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  body{ margin:0; font-family:'Outfit',system-ui,sans-serif; background:var(--bg); color:#20242a; padding-bottom:40px }
  header{ background:var(--ink); color:#fff; padding:16px 18px }
  header h1{ margin:0; font-size:22px; font-weight:800; letter-spacing:.3px }
  header h1 .t{ color:var(--teal) } header h1 .o{ color:var(--orange) }
  header .sub{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:#b9c6cc; margin-top:2px }
  .daynav{ display:flex; align-items:center; justify-content:center; gap:14px; padding:12px; background:#fff; border-bottom:1px solid var(--line) }
  .daynav button{ border:1px solid var(--line); background:#fff; border-radius:10px; width:40px; height:40px; font-size:20px; cursor:pointer }
  .daynav .d{ font-weight:700; font-size:16px; min-width:150px; text-align:center }
  .wrap{ max-width:640px; margin:0 auto; padding:14px }
  h2{ font-size:15px; text-transform:uppercase; letter-spacing:.6px; color:var(--soft); margin:22px 0 8px; border-bottom:1px solid var(--line); padding-bottom:6px }
  h2 .c{ color:var(--teal) }
  .item{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0; box-shadow:0 1px 2px rgba(0,0,0,.03) }
  .item.done{ background:#eef8f1; border-color:#bfe6cd }
  .item .top{ display:flex; align-items:center; gap:12px }
  .hab{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:20px; min-width:56px }
  .meta{ flex:1; min-width:0 }
  .meta .who{ font-weight:600; display:block }
  .meta .desc{ font-size:13px; color:var(--soft); margin-top:2px; display:block }
  .tag{ display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; margin-left:6px; vertical-align:middle }
  .tag.lleg{ background:#e3f4ea; color:var(--arr) } .tag.sal{ background:#fbe9e7; color:var(--dep) }
  .tag.rep{ background:#e8eefc; color:#3b5bbf } .tag.extra{ background:#fdf0d9; color:#a9741a }
  .doneBtn{ border:none; border-radius:12px; padding:12px 16px; font-weight:800; font-size:15px; cursor:pointer; white-space:nowrap; min-width:104px }
  .doneBtn.off{ background:#eee7d7; color:#8a7f66 }
  .doneBtn.on{ background:var(--arr); color:#fff }
  .note{ width:100%; margin-top:10px; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-family:inherit; font-size:14px }
  .note::placeholder{ color:#b3ab99 }
  .addbtn{ width:100%; border:1px dashed #c9c1af; background:#fff; color:#6b6552; border-radius:12px; padding:12px; font-weight:700; cursor:pointer; margin-top:6px }
  .none{ color:var(--soft); padding:10px 2px; font-style:italic }
  .summary{ position:sticky; bottom:0; background:var(--ink); color:#fff; text-align:center; padding:12px; font-weight:700; margin-top:24px; border-radius:12px }
  .banner{ background:var(--orange); color:#3a2a05; text-align:center; padding:10px; font-weight:700; cursor:pointer }
  .cfgwarn{ background:#fbe9e7; color:#8a2a1e; padding:12px 14px; text-align:center; font-weight:600 }
  .xf{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px }
  .xf input{ border:1px solid var(--line); border-radius:10px; padding:10px; font-family:inherit; font-size:14px }
  .xf .h{ width:90px } .xf .n{ flex:1; min-width:120px }
  .xf .ok{ background:var(--teal); color:#fff; border:none; border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer }
  .xf .ca{ background:#eee; border:none; border-radius:10px; padding:0 14px; cursor:pointer }
  .del{ border:none; background:transparent; color:#c0392b; font-size:16px; cursor:pointer; padding:4px 8px }
</style>
</head>
<body>
<header>
  <h1>ART <span class="t">Lim</span><span class="o">pieza</span> · Cierre</h1>
  <div class="sub">marcá lo que fuiste terminando · se guarda solo</div>
</header>

<div id="cfgWarn" class="cfgwarn" style="display:none">⚠ Falta configurar la conexión (SB_URL / SB_KEY).</div>
<div id="syncBanner" class="banner" style="display:none">🔄 El parte cambió — tocá para actualizar</div>

<div class="daynav">
  <button id="prevDay" aria-label="Día anterior">‹</button>
  <div class="d" id="dayLabel">—</div>
  <button id="nextDay" aria-label="Día siguiente">›</button>
</div>

<div class="wrap" id="wrap">
  <div class="none">Cargando…</div>
</div>

<script>
'use strict';
/* ====== CONEXIÓN (mismo proyecto Supabase que la app de tareas) ====== */
const SB_URL = 'https://nevhnfkbrwwelmokspzt.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldmhuZmticnd3ZWxtb2tzcHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MzA0NDgsImV4cCI6MjEwMDMwNjQ0OH0.fk05FBrzZZoqtBvz--jeWBWiHmbi6U-rSY4uzJXCMQY';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const SB_TAB = Math.random().toString(36).slice(2);
let sb = null;
try{ if (SB_URL && SB_KEY && window.supabase){ sb = window.supabase.createClient(SB_URL, SB_KEY); } }catch(e){ sb = null; }
if (!sb) $('cfgWarn').style.display = 'block';

/* ====== fechas ====== */
const pad = n => String(n).padStart(2,'0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function humanDate(iso){ const d = fromISO(iso); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; }

function opToday(){ const d = new Date(); if (d.getHours() < 5) d.setDate(d.getDate() - 1); return toISO(d); }
let curISO = opToday();   /* día operativo: de madrugada sigue siendo el día anterior */
let parte = null;
let cierreMap = {};   /* kind|hab -> row */

/* ====== datos ====== */
async function loadParte(){
  parte = null; cierreMap = {};
  if (!sb){ render(); return; }
  try{
    const r = await sb.from('limp_parte').select('data').eq('fecha', curISO).maybeSingle();
    parte = (r.data && r.data.data) || null;
  }catch(e){ parte = null; }
  try{
    const r = await sb.from('limp_cierre').select('*').eq('fecha', curISO);
    for (const c of (r.data || [])) cierreMap[c.kind + '|' + c.hab] = c;
  }catch(e){}
  render();
}

async function setDone(kind, hab, hecho){
  const key = kind + '|' + hab;
  const prev = cierreMap[key] || {};
  const row = { id: curISO + '|' + kind + '|' + hab, fecha: curISO, kind, hab, hecho, nota: prev.nota || '', src: SB_TAB, updated_at: new Date().toISOString() };
  cierreMap[key] = row;
  if (sb){ try{ await sb.from('limp_cierre').upsert(row); }catch(e){} }
}
async function setNota(kind, hab, nota){
  const key = kind + '|' + hab;
  const prev = cierreMap[key] || {};
  const row = { id: curISO + '|' + kind + '|' + hab, fecha: curISO, kind, hab, hecho: !!prev.hecho, nota, src: SB_TAB, updated_at: new Date().toISOString() };
  cierreMap[key] = row;
  if (sb){ try{ await sb.from('limp_cierre').upsert(row); }catch(e){} }
}
async function addExtra(hab, nota){
  const id = curISO + '|extra|' + hab + '-' + Date.now().toString(36);
  const row = { id, fecha: curISO, kind: 'extra', hab, hecho: true, nota, src: SB_TAB, updated_at: new Date().toISOString() };
  if (sb){ try{ await sb.from('limp_cierre').upsert(row); }catch(e){} }
  await loadParte();
}
async function delRow(id){
  if (sb){ try{ await sb.from('limp_cierre').delete().eq('id', id); }catch(e){} }
  await loadParte();
}

/* ====== render ====== */
function itemRow(kind, it){
  const base = (kind === 'pextra') ? (it.id || it.hab) : it.hab;
  const key = kind + '|' + base;
  const c = cierreMap[key];
  const done = !!(c && c.hecho);
  let who = esc(it.huesped || '—');
  let desc = '', tag = '';
  if (kind === 'pextra'){
    who = esc(it.desc || 'Tarea'); tag = '<span class="tag rep">extra</span>';
  } else if (kind === 'piso'){
    desc = esc(it.tipoLbl || '') + (it.coment ? ' · ' + esc(it.coment) : '') + (it.pax ? ' · ' + esc(it.pax) + ' pax' : '');
    if (it.obs === 'repaso') tag = '<span class="tag rep">repaso</span>';
    else if (it.tipo === 'llegada') tag = '<span class="tag lleg">llegada</span>';
    else tag = '<span class="tag sal">salida</span>';
  } else if (kind === 'fondo'){
    desc = (it.acciones || []).map(a => esc(a.label)).join(', ');
    tag = '<span class="tag rep">fondo</span>';
  } else {
    desc = it.hora ? esc(it.hora) : '';
  }
  const notaVal = c && c.nota ? esc(c.nota) : '';
  return `<div class="item ${done?'done':''}" data-k="${kind}" data-h="${esc(base)}">
    <div class="top">
      <span class="hab">${esc(it.hab)}</span>
      <span class="meta"><div class="who">${who} ${tag}</div>${desc ? `<div class="desc">${desc}</div>` : ''}</span>
      <button class="doneBtn ${done?'on':'off'}">${done?'✓ Hecho':'Marcar'}</button>
    </div>
    <input class="note" placeholder="nota (ej: 3 almohadas, nórdico extra, 2 kit sofá)" value="${notaVal}">
  </div>`;
}

function render(){
  const w = $('wrap');
  $('dayLabel').textContent = humanDate(curISO);
  if (!sb){ w.innerHTML = '<div class="none">Sin conexión configurada.</div>'; return; }
  if (!parte){
    w.innerHTML = '<div class="none">Todavía no hay parte cargado para este día. Cuando lo generen en la app de tareas, aparece acá.</div>' + extraSection();
    wireExtras();
    return;
  }
  const pisos = parte.pisos || [], toallas = parte.toallas || [], clientes = parte.clientes || [];
  let html = '';
  html += `<h2>Pisos a limpiar <span class="c">(${pisos.length})</span></h2>`;
  html += pisos.length ? pisos.map(it => itemRow('piso', it)).join('') : '<div class="none">Sin pisos.</div>';
  html += `<h2>Cambios de toalla <span class="c">(${toallas.length})</span></h2>`;
  html += toallas.length ? toallas.map(it => itemRow('toalla', it)).join('') : '<div class="none">Sin toallas.</div>';
  html += `<h2>Limpiezas de cliente <span class="c">(${clientes.length})</span></h2>`;
  html += clientes.length ? clientes.map(it => itemRow('cliente', it)).join('') : '<div class="none">Sin limpiezas de cliente.</div>';
  const fondos = parte.fondos || [];
  html += `<h2>Limpiezas de fondo <span class="c">(${fondos.length})</span></h2>`;
  html += fondos.length ? fondos.map(it => itemRow('fondo', it)).join('') : '<div class="none">Sin limpiezas de fondo.</div>';
  const pextras = parte.pextras || [];
  html += `<h2>Tareas extra <span class="c">(${pextras.length})</span></h2>`;
  html += pextras.length ? pextras.map(it => itemRow('pextra', it)).join('') : '<div class="none">Sin tareas extra.</div>';
  html += extraSection();
  html += summary(pisos, toallas, clientes, fondos, pextras);
  w.innerHTML = html;
  wireItems();
  wireExtras();
}

function extraSection(){
  return `<h2>Algo que hiciste de más</h2>
    <div id="extraList"></div>
    <div class="xf" id="xf">
      <input class="h" id="xfHab" placeholder="Apto" inputmode="numeric">
      <input class="n" id="xfNota" placeholder="qué hiciste (opcional)">
      <button class="ok" id="xfOk">Agregar</button>
    </div>`;
}

function summary(pisos, toallas, clientes, fondos, pextras){
  fondos = fondos || []; pextras = pextras || [];
  const all = [...pisos.map(x=>['piso',x]), ...toallas.map(x=>['toalla',x]), ...clientes.map(x=>['cliente',x]), ...fondos.map(x=>['fondo',x]), ...pextras.map(x=>['pextra',x])];
  let done = 0;
  for (const [k, it] of all){ const base = (k==='pextra')?(it.id||it.hab):it.hab; const c = cierreMap[k+'|'+base]; if (c && c.hecho) done++; }
  return `<div class="summary">${done} de ${all.length} hechos</div>`;
}

function wireItems(){
  document.querySelectorAll('.item[data-k]').forEach(el => {
    const kind = el.dataset.k, hab = el.dataset.h;
    const btn = el.querySelector('.doneBtn');
    if (btn) btn.addEventListener('click', async () => {
      const nowDone = !el.classList.contains('done');
      await setDone(kind, hab, nowDone);
      el.classList.toggle('done', nowDone);
      btn.className = 'doneBtn ' + (nowDone ? 'on' : 'off');
      btn.textContent = nowDone ? '✓ Hecho' : 'Marcar';
      refreshSummary();
    });
    const note = el.querySelector('.note');
    if (note){
      let t = null;
      note.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => setNota(kind, hab, note.value.trim()), 500); });
    }
  });
}
function refreshSummary(){
  const s = document.querySelector('.summary');
  if (!s || !parte) return;
  const all = [...(parte.pisos||[]).map(x=>['piso',x]), ...(parte.toallas||[]).map(x=>['toalla',x]), ...(parte.clientes||[]).map(x=>['cliente',x]), ...(parte.fondos||[]).map(x=>['fondo',x])];
  let done = 0; for (const [k,it] of all){ const c = cierreMap[k+'|'+it.hab]; if (c && c.hecho) done++; }
  s.textContent = `${done} de ${all.length} hechos`;
}

async function wireExtras(){
  /* listar extras existentes */
  if (sb){
    try{
      const r = await sb.from('limp_cierre').select('*').eq('fecha', curISO).eq('kind', 'extra');
      const list = $('extraList');
      if (list){
        const rows = r.data || [];
        list.innerHTML = rows.length ? rows.map(c =>
          `<div class="item done"><div class="top"><span class="hab">${esc(c.hab)}</span>`
          + `<span class="meta"><span class="who">${esc(c.nota||'extra')}<span class="tag extra">extra</span></span></span>`
          + `<button class="del" data-id="${esc(c.id)}">✕</button></div></div>`).join('') : '';
        list.querySelectorAll('.del').forEach(b => b.addEventListener('click', () => delRow(b.dataset.id)));
      }
    }catch(e){}
  }
  const ok = $('xfOk');
  if (ok) ok.addEventListener('click', async () => {
    const hab = ($('xfHab').value || '').trim();
    if (!hab){ $('xfHab').focus(); return; }
    await addExtra(hab, ($('xfNota').value || '').trim());
  });
}

/* ====== navegación de día ====== */
$('prevDay').addEventListener('click', () => { curISO = toISO(addDays(fromISO(curISO), -1)); loadParte(); });
$('nextDay').addEventListener('click', () => { curISO = toISO(addDays(fromISO(curISO),  1)); loadParte(); });

/* ====== realtime: si cambia el parte o el cierre, avisar/refrescar ====== */
function subscribe(){
  if (!sb) return;
  try{
    sb.channel('cierre_parte').on('postgres_changes', { event: '*', schema: 'public', table: 'limp_parte' }, payload => {
      const row = payload.new || payload.old || {};
      if (row.fecha === curISO){ $('syncBanner').style.display = 'block'; }
    }).subscribe();
  }catch(e){}
  try{
    sb.channel('cierre_cierre').on('postgres_changes', { event: '*', schema: 'public', table: 'limp_cierre' }, payload => {
      const row = payload.new || payload.old || {};
      if (row.src === SB_TAB) return;          /* cambio nuestro */
      if (row.fecha === curISO) loadParte();   /* otra persona marcó algo */
    }).subscribe();
  }catch(e){}
}
$('syncBanner').addEventListener('click', () => { $('syncBanner').style.display = 'none'; loadParte(); });

loadParte();
subscribe();
</script>
</body>
</html>
